{% extends "base.html" %}

{% block title %}Pago Cancelado{% endblock %}


{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-5 text-center shadow-lg" style="
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 20px;
        max-width: 500px;
        width: 100%;
        color: white;
    ">
        <div class="mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="#dc3545" class="bi bi-x-circle-fill"
                viewBox="0 0 16 16">
                <path
                    d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293 5.354 4.646z" />
            </svg>
        </div>

        <h1 class="fw-bold mb-3" style="color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Pago Cancelado</h1>
        <p class="fs-5 mb-4" style="color: #f0f0f0;">Hubo un problema o el proceso fue interrumpido. No se ha realizado
            ningún cargo.</p>

        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a href="{% url 'cart:cart_detail' %}" class="btn btn-warning btn-lg fw-bold px-4"
                style="border-radius: 50px;">
                Volver al carrito
            </a>
            <a href="{% url 'store:product_list' %}" class="btn btn-outline-light btn-lg fw-bold px-4"
                style="border-radius: 50px;">
                Ir a la tienda
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Iniciar Sesión - Océana{% endblock %}

{% block content %}
<div
    style="max-width: 400px; margin: 4rem auto; padding: 2rem; background: var(--bg-card); border-radius: var(--radius-md); border: 1px solid var(--border-color);">
    <h1 style="text-align: center; margin-bottom: 2rem;">Acceso Clientes</h1>
    <form method="post">
        {% csrf_token %}
        {% if next %}
        <input type="hidden" name="next" value="{{ next }}" />
        {% endif %}
        <!-- Simple rendering for now, can be improved with custom form rendering -->
        <div class="form-group">
            <label for="{{ form.username.id_for_label }}">Nombre de Usuario</label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label for="{{ form.password.id_for_label }}">Contraseña</label>
            {{ form.password }}
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Entrar</button>
    </form>
    <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary);">
        ¿No tienes cuenta? <a href="{% url 'accounts:register' %}" style="color: var(--accent-color);">Regístrate
            aquí</a>
    </p>
</div>
{% endblock %}

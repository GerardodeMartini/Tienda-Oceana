{% extends "base.html" %}

{% block title %}Nueva Categoría - Panel{% endblock %}

{% block content %}
<div
    style="max-width: 500px; margin: 4rem auto; background: var(--bg-card); padding: 2rem; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
    <h1 style="margin-bottom: 2rem; text-align: center;">Nueva Categoría</h1>

    <form method="post">
        {% csrf_token %}

        {% for field in form %}
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">{{ field.label }}</label>
            {{ field }}
            <style>
                input[type="text"] {
                    width: 100%;
                    padding: 0.75rem;
                    background: var(--bg-primary);
                    border: 1px solid var(--border-color);
                    border-radius: var(--radius-sm);
                    color: white;
                }
            </style>
        </div>
        {% endfor %}

        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Crear Categoría</button>
        <a href="javascript:history.back()"
            style="display: block; text-align: center; margin-top: 1rem; color: var(--text-secondary);">Cancelar</a>
    </form>
</div>
{% endblock %}
